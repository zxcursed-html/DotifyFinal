name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild -project DotifyClone.xcodeproj \
            -scheme DotifyClone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/DotifyClone.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DotifyClone.xcarchive/Products/Applications/DotifyClone.app build/Payload/
          cd build && zip -r DotifyClone.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotifyClone-ipa
          path: build/DotifyClone.ipa
