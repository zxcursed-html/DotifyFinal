name: DotifyClone
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
targets:
  DotifyClone:
    type: application
    platform: iOS
    sources: [DotifyClone]
    info:
      path: DotifyClone/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.dotifyclone
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
